<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>스턴트 대역 사무소</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
/* Layout: full-screen film set (canvas) with a production-office overlay laid out as a call sheet. Single deliberate dark look. */
:root {
  --night: #11131b;      /* studio darkness */
  --stage: #1c1f2b;      /* panel ground */
  --paper: #ebe6da;      /* call-sheet paper */
  --ink: #191a20;        /* text on paper */
  --tungsten: #ffb23e;   /* film-light accent */
  --rec: #ff4b3a;        /* REC red / danger */
  --ok: #4fd18b;         /* objective met */
  --muted: #8b8fa3;      /* secondary text on dark */
  --line: #2c3040;
  --display: "Black Han Sans", "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--night); color: var(--paper); font-family: var(--body); overflow: hidden; -webkit-tap-highlight-color: transparent; }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
button { font: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--tungsten); outline-offset: 2px; }

/* ---------- HUD ---------- */
.hud { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 12px); left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; pointer-events: none; }
.slate { pointer-events: auto; background: rgba(17,19,27,.86); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; min-width: 0; max-width: 420px; }
.slate .row1 { display: flex; flex-wrap: wrap; white-space: nowrap; gap: 4px 10px; align-items: baseline; font-family: var(--mono); font-size: 12px; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
.rec { color: var(--rec); display: inline-flex; align-items: center; gap: 6px; }
.rec::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--rec); animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: .2; } }
.slate h2 { font-family: var(--display); font-weight: 400; font-size: 20px; margin: 4px 0 6px; color: var(--paper); text-wrap: balance; }
.objs { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; font-size: 13px; }
.objs li { display: flex; gap: 8px; align-items: center; color: var(--paper); }
.objs li::before { content: ""; width: 12px; height: 12px; border: 2px solid var(--muted); border-radius: 3px; flex: none; }
.objs li.done { color: var(--ok); }
.objs li.done::before { background: var(--ok); border-color: var(--ok); }
.live { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-top: 6px; font-variant-numeric: tabular-nums; }
.hud-btns { display: flex; gap: 8px; pointer-events: auto; }
.ghost { background: rgba(17,19,27,.86); color: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; font-size: 13px; white-space: nowrap; }
.hint { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); background: rgba(17,19,27,.86); border: 1px solid var(--line); color: var(--paper); padding: 8px 14px; border-radius: 999px; font-size: 13px; pointer-events: none; white-space: nowrap; max-width: calc(100% - 24px); overflow: hidden; text-overflow: ellipsis; }
.hint.up { bottom: calc(env(safe-area-inset-bottom, 0px) + 8vh + 14px); }
.spin { position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); width: 76px; height: 76px; border-radius: 50%; border: 2px solid var(--tungsten); background: rgba(17,19,27,.7); color: var(--tungsten); font-size: 30px; line-height: 1; touch-action: none; user-select: none; -webkit-user-select: none; }
.spin.l { left: max(16px, env(safe-area-inset-left, 0px)); }
.spin.r { right: max(16px, env(safe-area-inset-right, 0px)); }
.spin.t { left: 50%; transform: translateX(-50%); font-size: 17px; font-weight: 700; width: 92px; height: 92px; bottom: calc(env(safe-area-inset-bottom, 0px) + 64px); }
.spin.on { background: var(--tungsten); color: var(--ink); }

/* ---------- Overlays ---------- */
.overlay { position: fixed; inset: 0; overflow-y: auto; background: rgba(10,11,16,.72); backdrop-filter: blur(3px); padding-block: calc(env(safe-area-inset-top, 0px) + 20px) calc(env(safe-area-inset-bottom, 0px) + 24px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.office { background: var(--night); }
.wrap { max-width: 1040px; margin: 0 auto; display: grid; gap: 20px; }

.masthead { display: grid; gap: 6px; }
.clapper { height: 14px; border-radius: 3px; background: repeating-linear-gradient(-45deg, var(--paper) 0 18px, var(--ink) 18px 36px); }
.masthead h1 { font-family: var(--display); font-weight: 400; font-size: clamp(32px, 6vw, 54px); line-height: 1.05; margin: 10px 0 0; color: var(--paper); letter-spacing: -.01em; }
.masthead p { margin: 0; color: var(--muted); max-width: 60ch; line-height: 1.6; }
.ledger { display: flex; flex-wrap: wrap; gap: 8px 22px; font-family: var(--mono); font-variant-numeric: tabular-nums; margin-top: 8px; }
.ledger div { display: grid; }
.ledger span { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.ledger b { font-size: 22px; color: var(--tungsten); font-weight: 600; }

.cols { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 760px) { .cols { grid-template-columns: minmax(0, 1fr); } }
.sec-h { font-family: var(--mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; display: flex; justify-content: space-between; }

.sheet { background: var(--paper); color: var(--ink); border-radius: 4px; overflow: hidden; }
.call { display: grid; grid-template-columns: 52px minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 14px 16px; border-bottom: 1px dashed #b9b2a2; }
.call:last-child { border-bottom: 0; }
.call .no { font-family: var(--mono); font-weight: 600; font-size: 12px; color: #6d6656; text-align: center; border: 1.5px solid #6d6656; border-radius: 3px; padding: 6px 0; }
.call h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 19px; }
.call .dir { font-size: 12px; color: #6d6656; margin-top: 2px; }
.call .brief { font-size: 13px; margin-top: 6px; line-height: 1.5; }
.call .meta { display: flex; flex-wrap: wrap; gap: 4px 12px; font-family: var(--mono); font-size: 12px; margin-top: 6px; color: #4b463b; }
.stars { color: #c98a14; letter-spacing: 2px; }
.stars .off { color: #c9c1ad; }
.go { background: var(--ink); color: var(--paper); border: 0; border-radius: 4px; padding: 10px 14px; font-weight: 700; font-size: 14px; white-space: nowrap; }
.go:hover { background: #000; }
.call.locked { opacity: .55; }
.call.locked .go { background: #b9b2a2; color: #5b5547; cursor: not-allowed; }

.gear { display: grid; gap: 10px; }
.item { background: var(--stage); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 4px 12px; align-items: center; }
.item h4 { margin: 0; font-size: 15px; font-weight: 700; }
.item p { margin: 0; font-size: 12.5px; color: var(--muted); grid-column: 1; }
.pips { display: flex; gap: 3px; grid-column: 1; margin-top: 4px; }
.pips i { width: 16px; height: 5px; border-radius: 2px; background: var(--line); }
.pips i.on { background: var(--tungsten); }
.btns { grid-row: 1 / span 3; grid-column: 2; display: grid; gap: 6px; justify-items: stretch; }
.sell { background: transparent; color: var(--muted); border: 1px dashed var(--line); border-radius: 4px; padding: 5px 10px; font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.sell:hover { color: var(--paper); border-color: var(--muted); }
.buy { background: transparent; color: var(--tungsten); border: 1.5px solid var(--tungsten); border-radius: 4px; padding: 8px 10px; font-family: var(--mono); font-weight: 600; font-size: 13px; font-variant-numeric: tabular-nums; }
.buy:disabled { color: var(--muted); border-color: var(--line); cursor: not-allowed; }
.foot { display: flex; flex-wrap: wrap; gap: 10px 18px; justify-content: space-between; font-size: 12px; color: var(--muted); }
.link { background: none; border: 0; color: var(--muted); text-decoration: underline; padding: 0; font-size: 12px; }
.confirm { display: inline-flex; gap: 8px; align-items: center; }

/* results */
.result { display: grid; place-items: center; }
.card { width: min(440px, 100%); background: var(--paper); color: var(--ink); border-radius: 6px; padding: 22px 22px 18px; position: relative; display: grid; gap: 12px; margin: auto; }
.stamp { font-family: var(--display); font-size: 54px; line-height: 1; color: var(--rec); transform: rotate(-6deg); border: 4px solid var(--rec); border-radius: 6px; padding: 4px 14px; justify-self: start; }
.stamp.ok { color: #138a52; border-color: #138a52; }
.quote { font-size: 15px; line-height: 1.55; margin: 0; }
.quote small { display: block; color: #6d6656; font-size: 12px; margin-top: 2px; }
.big-stars { font-size: 30px; letter-spacing: 6px; color: #c98a14; }
.big-stars .off { color: #cfc7b4; }
table.bill { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums; }
.bill td { padding: 4px 0; border-bottom: 1px dashed #c9c1ad; }
.bill td:last-child { text-align: right; }
.bill tr.total td { border-bottom: 0; font-weight: 600; font-size: 15px; padding-top: 8px; }
.neg { color: #c0392b; }
.replay-btn { background: var(--rec); color: #fff; border: 0; border-radius: 4px; padding: 11px 14px; font-weight: 700; font-size: 14px; }
.replay-btn:hover { filter: brightness(1.08); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.actions .go { flex: 1; }
.actions .alt { flex: 1; background: transparent; color: var(--ink); border: 1.5px solid var(--ink); border-radius: 4px; padding: 10px 14px; font-weight: 700; font-size: 14px; }
.err { max-width: 520px; margin: 20vh auto 0; text-align: center; color: var(--paper); line-height: 1.6; }
@media (prefers-reduced-motion: reduce) { .rec::before { animation: none; } }
</style>
</head>
<body>
<canvas id="c" aria-label="스턴트 촬영장"></canvas>

<div class="hud" id="hud" hidden>
  <div class="slate">
    <div class="row1"><span class="rec">REC</span><span id="hudScene">SCENE 1</span><span id="hudTake">TAKE 1</span></div>
    <h2 id="hudTitle"></h2>
    <ul class="objs" id="hudObjs"></ul>
    <div class="live" id="hudLive"></div>
  </div>
  <div class="hud-btns">
    <button class="ghost" id="btnMute" type="button">소리 켜짐</button>
    <button class="ghost" id="btnOffice" type="button">사무소로</button>
  </div>
</div>
<div class="hint" id="hint" hidden></div>
<button class="spin l" id="spinL" type="button" aria-label="반시계 방향 회전" hidden>⟲</button>
<button class="spin r" id="spinR" type="button" aria-label="시계 방향 회전" hidden>⟳</button>
<button class="spin t" id="thrust" type="button" aria-label="추진기 분사" hidden>추진</button>

<div class="overlay office" id="office" hidden></div>
<div class="overlay result" id="result" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
(() => {
"use strict";
if (!window.Matter) {
  document.getElementById("office").hidden = false;
  document.getElementById("office").innerHTML = '<div class="err"><h2>물리 엔진을 불러오지 못했습니다</h2><p>인터넷 연결을 확인한 뒤 새로고침해 주세요. (cdnjs.cloudflare.com 에서 Matter.js를 받아옵니다)</p></div>';
  return;
}
const { Engine, Bodies, Body, Composite, Constraint, Events } = Matter;

/* ================= constants ================= */
const H = 900, GROUND = 860, STEP = 1000 / 60;
const LAUNCHER = { x: 150, y: GROUND - 70 };
const SAVE_KEY = "stunt-agency-v1";
const G_STEP = 0.001 * STEP * STEP; // per-step gravity, matches Matter's integrator

/* ================= save ================= */
const DEFAULT = { money: 150, stars: {}, cleared: {}, up: { power: 0, air: 0, pad: 0, agent: 0, aim: 0 }, muted: false, seenIntro: false };
const clone = o => JSON.parse(JSON.stringify(o));
function loadSave() {
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (s && typeof s === "object") return Object.assign(clone(DEFAULT), s, { up: Object.assign({}, DEFAULT.up, s.up || {}) });
  } catch (e) {}
  return clone(DEFAULT);
}
let save = loadSave();
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }
const totalStars = () => Object.values(save.stars).reduce((a, b) => a + b, 0);

/* ================= upgrades ================= */
const UPG = [
  { id: "power", name: "발사대 출력", desc: "대포 압력을 올려 더 멀리 날린다.", base: 110, max: 5, fx: l => `최대 속도 ${maxSpeed(l).toFixed(1)}` },
  { id: "air",   name: "공중 제어 훈련", desc: "비행 중 ⟲ ⟳ (← →) 회전이 빨라진다.", base: 90, max: 5, fx: l => `회전력 ${(airTorque(l) * 1000).toFixed(0)}` },
  { id: "pad",   name: "보호 패드", desc: "단계마다 병원비 15% 절감.", base: 80, max: 5, fx: l => `병원비 −${l * 15}%` },
  { id: "agent", name: "협상 전문 매니저", desc: "단계마다 출연료 15% 인상.", base: 160, max: 5, fx: l => `출연료 +${l * 15}%` },
  { id: "aim",   name: "조준 보조 레이저", desc: "궤적 미리보기가 길어진다.", base: 60, max: 5, fx: l => `미리보기 ${aimDots(l)}칸` },
];
const upCost = (u, l) => Math.round(u.base * Math.pow(1.7, l));
const maxSpeed = l => 21 + 2.6 * l;
const airTorque = l => 0.011 + 0.0045 * l;
const aimDots = l => 7 + 5 * l;

/* ================= contracts ================= */
const DIRECTORS = {
  choi: "최고집 감독", wang: "왕폭발 감독", jenny: "제니 슬로모 감독", noh: "노컷 감독",
};
const CONTRACTS = [
  {
    id: "hay", scene: 1, title: "시골 로맨스: 건초 속으로", dir: "choi", reward: 120, need: 0, W: 1700, t2: 480, t3: 700,
    brief: "주인공이 대포에서 날아가 건초더미에 폭 안겨. 간단하지?",
    objs: [{ t: "건초더미에 착지", end: true, f: s => s.landed === "hay" }],
    build(L) { L.soft("hay", 980, 250); L.zone("hay", 980, 250, 170); L.marker(980, "착지!"); },
  },
  {
    id: "melon", scene: 7, title: "추격전: 과일가게를 지나며", dir: "wang", reward: 180, need: 2, W: 1800, t2: 640, t3: 900,
    brief: "과일가게는 추격전의 국룰이야. 수박 3통 이상 박살 내.",
    objs: [{ t: "수박 3통 이상 박살", f: s => s.broken.melon >= 3 }],
    build(L) {
      L.table(1020, 320, 70);
      for (let i = 0; i < 7; i++) L.melon(905 + i * 39, GROUND - 70 - 17 - 1);
      for (let i = 0; i < 3; i++) L.melon(925 + i * 39 + 19, GROUND - 70 - 17 * 3 - 2);
      L.marker(1020, "박살!", GROUND - 180);
    },
  },
  {
    id: "glass", scene: 12, title: "유리의 성", dir: "jenny", reward: 260, need: 4, W: 1900, t2: 620, t3: 900,
    brief: "유리 두 장 이상 뚫고 날아가. 전부 슬로모션으로 쓸 거야.",
    objs: [{ t: "유리창 2장 이상 관통", f: s => s.broken.glass >= 2 }],
    build(L) {
      L.glass(700, 610, 210); L.glass(930, 560, 230); L.glass(1160, 600, 220);
      L.soft("hay", 1500, 260);
      L.marker(930, "관통!", 400);
    },
  },
  {
    id: "flip", scene: 23, title: "서커스 오브 더 데드", dir: "noh", reward: 340, need: 6, W: 1900, t2: 950, t3: 1250,
    brief: "공중에서 두 바퀴 돌고 매트에 착지. 원테이크로 간다. (비행 중 ⟲ ⟳ 또는 ← →)",
    objs: [{ t: "공중 2회전 이상", f: s => s.flipsAir >= 2 }, { t: "안전 매트에 착지", end: true, f: s => s.landed === "mat" }],
    build(L) { L.soft("mat", 1250, 340); L.zone("mat", 1250, 340, 170); L.marker(1250, "착지!"); },
  },
  {
    id: "bell", scene: 31, title: "종소리가 울리면", dir: "choi", reward: 420, need: 8, W: 1900, t2: 720, t3: 1000,
    brief: "담장 너머 종탑의 종을 몸으로 울려. 관객이 소리를 들어야 해.",
    objs: [{ t: "종 울리기", f: s => s.bell }],
    build(L) { L.wall(600, 300); L.bell(1060, 380); L.soft("hay", 1340, 240); L.marker(1060, "딩!", 280); },
  },
  {
    id: "balloon", scene: 40, title: "생일 파티 대소동", dir: "jenny", reward: 450, need: 10, W: 1800, t2: 780, t3: 980,
    brief: "생일 파티장에 날아들어서 풍선 4개 이상 터뜨려. 터질 때마다 컷을 바꿀 거야.",
    objs: [{ t: "풍선 4개 이상 터뜨리기", f: s => s.broken.balloon >= 4 }],
    build(L) {
      const pts = [[620, 560], [720, 480], [820, 430], [930, 410], [1040, 440], [1150, 500], [1260, 580], [870, 570], [1010, 610]];
      const cols = ["#ff5d73", "#ffb23e", "#5ec8ff", "#8be36a", "#c68bff"];
      pts.forEach((pt, i) => L.balloon(pt[0], pt[1], cols[i % cols.length]));
      L.soft("hay", 1500, 240);
      L.marker(930, "펑!", 340);
    },
  },
  {
    id: "tramp", scene: 52, title: "옥상 탈출", dir: "noh", reward: 480, need: 12, W: 1900, t2: 650, t3: 880,
    brief: "트램펄린을 밟고 튀어 올라 담장을 넘은 뒤 건초더미에 착지. 그냥 넘어가면 무효야.",
    objs: [{ t: "트램펄린 밟기", f: s => s.bounces >= 1 }, { t: "담장 너머 건초더미에 착지", end: true, f: s => s.landed === "hay" }],
    build(L) { L.tramp(640, 200); L.wall(980, 360); L.soft("hay", 1330, 280); L.zone("hay", 1330, 280, 170); L.marker(640, "밟기!", GROUND - 70); },
  },
  {
    id: "roadster", scene: 58, title: "로켓 로드스터", dir: "jenny", reward: 520, need: 14, W: 2000, t2: 700, t3: 880, projectile: "car",
    brief: "이번엔 사람이 아니라 추진기 달린 전기 스포츠카를 쏜다. 가스는 5초분. 옥상 착지대에 바퀴부터 사뿐히 내려놔.",
    objs: [
      { t: "옥상 착지대에 착지", end: true, f: s => s.landed === "pad" },
      { t: "충격 속도 6 이하로 사뿐히", f: s => s.touched && s.maxImpact <= 6 },
      { t: "바퀴가 아래로 향하게", end: true, f: s => s.upright },
    ],
    build(L) { L.roof(1450, 300, 230); L.marker(1450, "착지대", GROUND - 300); },
  },

let actx = null;
function audio() {
  if (save.muted) return null;
  try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === "suspended") actx.resume(); } catch (e) { return null; }
  return actx;
}
function noise(dur, freq, gain, type = "lowpass") {
  const a = audio(); if (!a) return;
  const n = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
  const src = a.createBufferSource(); src.buffer = buf;
  const f = a.createBiquadFilter(); f.type = type; f.frequency.value = freq;
  const g = a.createGain(); g.gain.value = gain;
  src.connect(f); f.connect(g); g.connect(a.destination); src.start();
}
function tone(freq, dur, gain, type = "sine", slide = 0) {
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(); o.type = type; o.frequency.value = freq;
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), a.currentTime + dur);
  g.gain.setValueAtTime(gain, a.currentTime); g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
  o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + dur);
}

  bell() { tone(660, 1.8, 0.35, "sine"); tone(1320, 1.2, 0.12, "sine"); tone(1990, 0.8, 0.05, "sine"); },
  thud(v) { tone(80, 0.18, Math.min(0.5, v / 30), "sine", -40); },

function isRag(b) { return b && b.plugin && b.plugin.rag; }

function buildLevel(c) {
  engine = Engine.create();
  engine.gravity.y = 1;
  const world = engine.world;
  const L = { W: c.W, bodies: [], zones: [], decor: [], markers: [], water: null };
  const add = b => { Composite.add(world, b); L.bodies.push(b); return b; };
  const kind = (b, k, extra) => { b.plugin = Object.assign({ kind: k }, extra || {}); return b; };
  add(kind(Bodies.rectangle(c.W / 2, GROUND + 60, c.W + 1600, 120, { isStatic: true, friction: 0.9, restitution: 0.05 }), "ground"));
  L.soft = (k, x, w) => add(kind(Bodies.rectangle(x, GROUND - 22, w, 44, { isStatic: true, friction: 1, restitution: 0, chamfer: { radius: 14 } }), k, { w }));
  L.zone = (k, x, w, h) => L.zones.push({ k, x0: x - w / 2, x1: x + w / 2, y0: GROUND - h, y1: GROUND + 5 });
  L.marker = (x, text, y) => L.markers.push({ x, y: y || GROUND - 120, text });
  L.table = (x, w, h) => { add(kind(Bodies.rectangle(x, GROUND - h + 7, w, 14, { isStatic: true, friction: 0.8 }), "table", { w, h })); };
  L.melon = (x, y) => add(kind(Bodies.circle(x, y, 17, { density: 0.0016, friction: 0.5, restitution: 0.2 }), "melon"));
  L.crate = (x, y, s) => add(kind(Bodies.rectangle(x, y, s, s, { density: 0.0015, friction: 0.7 }), "crate", { s }));
  L.balloon = (x, y, col) => add(kind(Bodies.circle(x, y, 22, { isStatic: true }), "balloon", { col }));
  L.ring = (x, y, rr) => { add(kind(Bodies.circle(x, y, rr, { isStatic: true, isSensor: true }), "ring", { r: rr })); L.decor.push({ type: "pole", x, y0: y + rr, y1: GROUND }); };
  L.tramp = (x, w) => add(kind(Bodies.rectangle(x, GROUND - 30, w, 16, { isStatic: true }), "tramp", { w }));
  L.bus = x => add(kind(Bodies.rectangle(x, GROUND - 48, 112, 96, { isStatic: true, friction: 0.8 }), "bus"));
  // rooftop landing pad: building of height h, pad zone on its roof

    L.zones.push({ k: "pad", x0: x - w / 2, x1: x + w / 2, y0: GROUND - h - 140, y1: GROUND - h + 5 });
  };
  L.hang = (x, y, s) => { add(kind(Bodies.rectangle(x, y, s, s, { isStatic: true }), "crate", { s })); L.decor.push({ type: "rope", x, y0: 0, y1: y - s / 2 }); };
  L.glass = (x, y, h) => { add(kind(Bodies.rectangle(x, y, 12, h, { isStatic: true }), "glass", { h })); L.decor.push({ type: "post", x, y0: y + h / 2, y1: GROUND }); };
  L.wall = (x, h) => add(kind(Bodies.rectangle(x, GROUND - h / 2, 44, h, { isStatic: true, friction: 0.8 }), "wall", { h }));
  L.bell = (x, y) => { add(kind(Bodies.circle(x, y, 30, { isStatic: true }), "bell")); L.decor.push({ type: "tower", x, y }); };
  L.pool = (x, w, h) => {
    add(kind(Bodies.rectangle(x - w / 2 - 12, GROUND - h / 2, 24, h, { isStatic: true }), "poolwall", { h }));
    add(kind(Bodies.rectangle(x + w / 2 + 12, GROUND - h / 2, 24, h, { isStatic: true }), "poolwall", { h }));
    L.water = { x0: x - w / 2, x1: x + w / 2, y0: GROUND - h + 14, y1: GROUND };
    L.zones.push({ k: "water", x0: L.water.x0, x1: L.water.x1, y0: L.water.y0 - 10, y1: GROUND + 5 });

function buildRagdoll(x, y, rot) {
  const group = Body.nextGroup(true);
  const o = { collisionFilter: { group }, frictionAir: 0.004, friction: 0.6, restitution: 0.15, density: 0.0012 };
  const part = (b, p) => { b.plugin = { rag: true, part: p }; return b; };
  const torso = part(Bodies.rectangle(x, y, 22, 48, Object.assign({ chamfer: { radius: 8 } }, o)), "torso");
  const head = part(Bodies.circle(x, y - 38, 13, o), "head");
  const armL = part(Bodies.rectangle(x - 2, y, 9, 36, Object.assign({ chamfer: { radius: 4 } }, o)), "arm");
  const armR = part(Bodies.rectangle(x + 2, y, 9, 36, Object.assign({ chamfer: { radius: 4 } }, o)), "arm");
  const legL = part(Bodies.rectangle(x - 5, y + 43, 11, 46, Object.assign({ chamfer: { radius: 5 } }, o)), "leg");
  const legR = part(Bodies.rectangle(x + 5, y + 43, 11, 46, Object.assign({ chamfer: { radius: 5 } }, o)), "leg");
  const j = (a, b, pa, pb) => Constraint.create({ bodyA: a, bodyB: b, pointA: pa, pointB: pb, length: 0, stiffness: 0.7, damping: 0.05 });
  const comp = Composite.create();
  Composite.add(comp, [torso, head, armL, armR, legL, legR,
    j(torso, head, { x: 0, y: -24 }, { x: 0, y: 13 }),
    j(torso, armL, { x: 0, y: -18 }, { x: 0, y: -18 }),
    j(torso, armR, { x: 0, y: -18 }, { x: 0, y: -18 }),
    j(torso, legL, { x: -5, y: 20 }, { x: 0, y: -23 }),
    j(torso, legR, { x: 5, y: 20 }, { x: 0, y: -23 })]);
  Composite.rotate(comp, rot, { x, y });
  return { comp, torso, head, parts: [torso, head, armL, armR, legL, legR], limbs: { armL, armR, legL, legR } };
}

function launch() {
  if (state !== "aim") return;
  const a = aim.angle * Math.PI / 180, v = maxSpeed(save.up.power) * aim.power;
  const dx = Math.cos(a), dy = -Math.sin(a);
  const mx = LAUNCHER.x + dx * 70, my = LAUNCHER.y + dy * 70;
  const isCar = contract.projectile === "car";
  rag = isCar ? buildCar(mx, my, -a * 0.5) : buildRagdoll(mx, my, Math.atan2(dy, dx) + Math.PI / 2);
  Composite.add(engine.world, rag.comp);
  for (const p of rag.parts) Body.setVelocity(p, { x: dx * v, y: dy * v });
  Body.setAngularVelocity(rag.torso, isCar ? 0 : (Math.random() - 0.5) * 0.04);
  stats = newStats(); stats.lastAngle = rag.torso.angle;
  if (isCar) stats.fuel = CAR_FUEL;
  takeNo++;
  state = "fly";
  shake = 10;
  recording = { tracked: level.bodies.concat(rag.parts), frames: [], flame: [], events: [], bellStep: -1 };
  recordFrame();
  fx("sfx", { n: "boom" });
  fx("smoke", { x: mx, y: my, dx, dy });
  updateHud();
}

/* ---------- physics callbacks ---------- */
const BREAK = { glass: 5.5, melon: 4, crate: 7, balloon: 0.5 };
const LANDING = { ground: 1, hay: 1, mat: 1, table: 1, wall: 1, poolwall: 1, bus: 1, roof: 1 };
const SOFT = { hay: 0.15, mat: 0.25 };
function onCollision(e) {
  if (state !== "fly") return;
  for (const pair of e.pairs) {
    const a = pair.bodyA, b = pair.bodyB, ra = isRag(a), rb = isRag(b);
    if (ra === rb) continue;
    const r = ra ? a : b, o = ra ? b : a, k = o.plugin && o.plugin.kind;
    // velocities shrink with slow-motion timeScale; normalise to real speed
    const rel = Math.hypot(r.velocity.x - o.velocity.x, r.velocity.y - o.velocity.y) / (engine.timing.timeScale || 1);
    if (o.plugin.broken) { pair.isActive = false; continue; }
    if (BREAK[k] && rel > BREAK[k]) {
      o.plugin.broken = true; pair.isActive = false;
      stats.broken[k]++; pendingRemove.push(o);
      const keep = k === "crate" ? 0.95 : 0.9;
      for (const p of rag.parts) Body.setVelocity(p, { x: p.velocity.x * keep, y: p.velocity.y * keep });
      shatter(o, k);
      continue;
    }
    if (k === "ring") {
      if (r === rag.torso && !o.plugin.passed) { o.plugin.passed = true; stats.rings++; slowLeft = 20; fx("ring", { x: o.position.x, y: o.position.y, r: o.plugin.r }); floater(o.position.x, o.position.y - o.plugin.r - 20, "통과!", "#ffb23e"); }
      continue;
    }
    if (k === "tramp") {
      pair.isActive = false;
      if (stats.steps - stats.lastBounce > 15) {
        const ts = engine.timing.timeScale || 1, vy = Math.max(18 * ts, Math.abs(r.velocity.y) * 1.05);
        stats.lastBounce = stats.steps; stats.bounces++;
        for (const p of rag.parts) Body.setVelocity(p, { x: p.velocity.x, y: -vy });
        fx("sfx", { n: "boing" }); floater(o.position.x, o.position.y - 60, "보잉!", "#4fd18b");
      }
      continue;
    }
    if (k === "bell") {
      if (!stats.bell) { stats.bell = true; recording.bellStep = recording.frames.length; fx("sfx", { n: "bell" }); slowLeft = 40; floater(o.position.x, o.position.y - 50, "딩—!", "#ffb23e"); }
      continue;
    }
    if (rag.car && LANDING[k]) {
      if (!stats.touched) { stats.touched = true; stats.touchStep = recording ? recording.frames.length : 0; }
      stats.maxImpact = Math.max(stats.maxImpact, rel);
      if (rel > 9) { fx("sfx", { n: "crate" }); floater(r.position.x, r.position.y - 50, "쾅!", "#ff4b3a"); shake = Math.max(shake, 12); }
      else if (rel > 0.5 && stats.airborne) floater(r.position.x, r.position.y - 50, rel <= 6 ? "사뿐!" : "덜컹!", rel <= 6 ? "#4fd18b" : "#ffb23e");
    }
    if (stats.airborne && LANDING[k]) stats.airborne = false;
    if (SOFT[k] !== undefined) {
      for (const p of rag.parts) Body.setVelocity(p, { x: p.velocity.x * 0.45, y: p.velocity.y * 0.35 });
    }
    const factor = SOFT[k] !== undefined ? SOFT[k] : 1;
    const dmg = rag.car ? Math.max(0, rel - 4) * 6 : Math.max(0, rel - 5) * (r.plugin.part === "head" ? 2.4 : 1) * factor;
    if (dmg > 0) {
      stats.injury += dmg;
      if (dmg > 6 && !rag.car) { fx("sfx", { n: "thud", v: rel }); shake = Math.max(shake, Math.min(14, dmg)); if (dmg > 14) floater(r.position.x, r.position.y - 30, pick(["으악!", "아야!", "끄억", "내 허리!"]), "#ff4b3a"); }
    }
  }
}
function beforeUpdate() {
  if (!rag || state !== "fly") return;
  const t = rag.torso;
  if (rag.car) { carControl(t); return; }
  if (spinInput && stats.airborne) {
    const av = Math.max(-0.32, Math.min(0.32, t.angularVelocity + spinInput * airTorque(save.up.air)));
    Body.setAngularVelocity(t, av);
  }
  const W = level.water;
  if (W) {
    let any = false;
    for (const p of rag.parts) {
      if (p.position.x > W.x0 && p.position.x < W.x1 && p.position.y > W.y0) {
        any = true;
        Body.setVelocity(p, { x: p.velocity.x * 0.9, y: p.velocity.y * 0.88 - 0.32 });
      }
    }
    if (any) {
      stats.airborne = false;
      if (!stats.splashed) { stats.splashed = true; fx("splash", { x: t.position.x, y: W.y0 }); }
    }
  }
}

/* ---------- rocket roadster (car projectile) ---------- */
const CAR_FUEL = 300;          // 5 seconds of cold gas at 60 steps/s
const CAR_THRUST = 0.62;       // per-step acceleration, a bit over 2g
function buildCar(x, y, rot) {
  const car = Bodies.rectangle(x, y, 130, 44, { chamfer: { radius: 10 }, frictionAir: 0.004, friction: 0.8, restitution: 0.08, density: 0.002 });
  car.plugin = { rag: true, part: "car" };
  Body.setAngle(car, rot);
  return { comp: car, torso: car, head: car, parts: [car], car: true };
}
function carControl(t) {
  const ts = engine.timing.timeScale || 1;
  rag.thrusting = thrustInput && stats.fuel > 0;
  if (rag.thrusting) {
    stats.fuel = Math.max(0, stats.fuel - ts);
    const ux = Math.sin(t.angle), uy = -Math.cos(t.angle); // car's "up"
    Body.setVelocity(t, { x: t.velocity.x + ux * CAR_THRUST * ts * ts, y: t.velocity.y + uy * CAR_THRUST * ts * ts });
    if (stats.steps % 6 === 0) fx("sfx", { n: "hiss" });
    for (const sx of [-38, 38]) {
      const px = t.position.x + Math.cos(t.angle) * sx - ux * 24, py = t.position.y + Math.sin(t.angle) * sx - uy * 24;
      spawnParticle(px, py, -ux * 7 + (Math.random() - 0.5) * 2, -uy * 7 + (Math.random() - 0.5) * 2, Math.random() < 0.5 ? "#dfe8ff" : "#8fd3ff", 4 + Math.random() * 4, 0.35, "smoke");
    }
  }
  // attitude jets: rotate on input, otherwise gyro damping holds the car steady
  if (stats.airborne) {
    let av = t.angularVelocity;
    av = spinInput ? av + spinInput * 0.0045 * ts : av * 0.96;
    Body.setAngularVelocity(t, Math.max(-0.09, Math.min(0.09, av)));
  }
}
function shatter(b, k) {
  const { x, y } = b.position;
  fx("shatter", { k, x, y, h: b.plugin.h || 0, col: b.plugin.col });
  if (k === "balloon") floater(x, y - 36, "펑!", b.plugin.col);
  if (k === "glass") slowLeft = 28;
  if (k === "crate") slowLeft = 18;
  if (k === "melon") floater(x, y - 40, "퍽!", "#e8434f");
  if (k === "crate") floater(x, y - 50, "콰직!", "#ffb23e");
}
/* Visual/audio effects go through fx() so a take can be replayed: live calls run and record, replay re-runs them. */
function fx(type, d) {
  if (recording && state === "fly") recording.events.push({ step: recording.frames.length, type, d });
  runFx(type, d);
}
function runFx(type, d) {
  if (type === "sfx") { SFX[d.n](d.v); if (d.n === "bell") shake = 8; }
  else if (type === "smoke") { for (let i = 0; i < 24; i++) spawnParticle(d.x, d.y, d.dx * 6 + (Math.random() - 0.5) * 8, d.dy * 6 + (Math.random() - 0.5) * 8, "#d8d2c4", 6 + Math.random() * 8, 0.6, "smoke"); }

  else if (type === "shatter") {
    const { k, x, y } = d;
    if (k === "balloon") { SFX.pop(); for (let i = 0; i < 16; i++) spawnParticle(x, y, (Math.random() - 0.5) * 9, (Math.random() - 0.6) * 9, d.col || "#ff5d73", 3 + Math.random() * 5, 0.8, "shard"); }

    if (k === "melon") { SFX.melon(); for (let i = 0; i < 22; i++) spawnParticle(x, y, (Math.random() - 0.5) * 10, -Math.random() * 9, i % 3 ? "#e8434f" : "#2f7a3a", 4 + Math.random() * 6, 1, "chunk"); }

/* ---------- simulation step ---------- */
function stepPhysics() {
  const slow = slowLeft > 0 && !reducedMotion;
  if (slowLeft > 0) slowLeft--;
  engine.timing.timeScale = slow ? 0.3 : 1;
  Engine.update(engine, STEP);
  for (const b of pendingRemove) { Composite.remove(engine.world, b); b.plugin.removed = true; }
  pendingRemove.length = 0;
  if (state === "fly") { recordFrame(); trackTake(); }
}
function zoneAt(x, y) {
  for (const z of level.zones) {
    if (x >= z.x0 && x <= z.x1 && y >= z.y0 && y <= z.y1) return z.k;
  }
  return null;
}
function trackTake() {
  const s = stats, t = rag.torso;
  s.steps++;
  if (s.airborne) {
    s.airSteps++;
    s.cumAngle += t.angle - s.lastAngle;
    s.flipsAir = Math.floor(Math.abs(s.cumAngle) / (Math.PI * 2) + 0.08);
  }
  s.lastAngle = t.angle;
  s.maxX = Math.max(s.maxX, t.position.x);
  s.landed = zoneAt(t.position.x, t.position.y);
  if (rag.car) { const na = ((t.angle % (Math.PI * 2)) + Math.PI * 3) % (Math.PI * 2) - Math.PI; s.upright = Math.abs(na) < 0.4; }
  const slowAll = rag.parts.every(p => p.speed < 0.35 && Math.abs(p.angularVelocity) < 0.03);
  s.slowSteps = slowAll ? s.slowSteps + 1 : 0;
  if (s.splashed) s.inWaterSteps++;
  const out = t.position.x > level.W + 300 || t.position.x < -300 || t.position.y > H + 200;
  if ((s.steps > 50 && s.slowSteps > 40) || s.inWaterSteps > 100 || s.steps > 720 || out) endTake();
  if (s.steps % 6 === 0) updateHud();
}

/* ================= scoring ================= */
function score(c, s) {
  const success = c.objs.every(o => o.f(s));
  const brokenN = Object.values(s.broken).reduce((a, b) => a + b, 0);
  const air = s.airSteps / 60;
  const parts = [
    ["의뢰 달성", success ? 300 : 0],
    [`공중 ${s.flipsAir}회전`, s.flipsAir * 120],
    [`소품 파괴 ${brokenN}개`, brokenN * 60],
    [`체공 ${air.toFixed(1)}초`, Math.round(air * 40)],
    ["종 울림", s.bell ? 150 : 0],
    [`불 고리 ${s.rings}개`, s.rings * 100],
    [`트램펄린 ${s.bounces}회`, s.bounces * 80],
    ["리얼한 고통 연기", c.projectile === "car" ? 0 : Math.round(Math.min(150, s.injury))],
    ["남은 가스", c.projectile === "car" && success ? Math.round(s.fuel / CAR_FUEL * 250) : 0],
    ["사뿐한 착지", c.projectile === "car" && success ? Math.round(Math.max(0, 6 - s.maxImpact) * 50) : 0],
  ];
  const total = parts.reduce((a, p) => a + p[1], 0);
  return { success, parts, total };
}
function endTake() {
  if (state !== "fly") return;
  state = "result";
  spinInput = 0; thrustInput = false;
  SFX.cut();
  const c = contract, s = stats, sc = score(c, s);
  const first = !save.cleared[c.id];
  const stars = sc.success ? 1 + (sc.total >= c.t2 ? 1 : 0) + (sc.total >= c.t3 ? 1 : 0) : 0;
  const pay = sc.success ? Math.round(c.reward * (first ? 1 : 0.35) * (1 + 0.15 * save.up.agent)) : 0;
  const bonus = Math.round(sc.total * (sc.success ? 0.25 : 0.08));
  const medical = Math.round(s.injury * 1.6 * (1 - 0.15 * save.up.pad));
  const net = pay + bonus - medical;
  const prevStars = save.stars[c.id] || 0;
  save.money = Math.max(0, save.money + net);
  if (sc.success) save.cleared[c.id] = true;
  save.stars[c.id] = Math.max(prevStars, stars);
  persist();
  const hurt = s.injury > 90;
  const line = !sc.success ? (hurt ? pick(LINES.hurt) : pick(LINES.fail)) : stars >= 3 ? pick(LINES.great) : hurt ? pick(LINES.hurt) : pick(LINES.ok);
  setTimeout(() => showResult({ sc, stars, prevStars, pay, bonus, medical, net, first, line }), reducedMotion ? 0 : 650);
  updateHud();
}

/* ================= replay ================= */
function recordFrame() {
  const t = recording.tracked, f = new Float32Array(t.length * 4);
  for (let i = 0; i < t.length; i++) { const b = t[i]; f[i * 4] = b.plugin.removed ? 0 : 1; f[i * 4 + 1] = b.position.x; f[i * 4 + 2] = b.position.y; f[i * 4 + 3] = b.angle; }
  recording.frames.push(f);
  recording.flame.push(rag && rag.thrusting ? 1 : 0);
}
const KEY_FX = { shatter: 1, splash: 1, ring: 1 };
function startReplay() {
  if (!recording || recording.frames.length < 2 || state !== "result") return;
  // drop the tail where the stuntman just lies still
  const last = Math.max(1, recording.frames.length - 1 - (stats && stats.slowSteps > 40 ? 36 : 0));
  // slow down around the money shots: breaks, splash, bell, big hits
  const slow = new Uint8Array(last + 1);
  const mark = s => { for (let i = Math.max(0, s - 8); i <= Math.min(last, s + 22); i++) slow[i] = 1; };
  for (const e of recording.events) if (KEY_FX[e.type] || (e.type === "sfx" && (e.d.n === "bell" || e.d.n === "boing"))) mark(e.step);
  if (contract.projectile === "car" && stats && stats.touchStep >= 0) mark(stats.touchStep);
  replay = { rf: 0, ei: 0, last, slow, zoom: 1, hold: 0, speed: 1, events: recording.events.slice().sort((a, b) => a.step - b.step) };
  particles = []; floaters = []; shake = 0;
  state = "replay";
  $("result").hidden = true;
  applyReplayFrame(0);
  updateHud();
}
function endReplay() {
  if (state !== "replay") return;
  applyReplayFrame(replay.last);
  for (const b of recording.tracked) b.plugin.rhidden = false;
  replay = null; particles = []; floaters = [];
  state = "result";
  updateHud();
  if (lastResult) showResult(lastResult);
}
function applyReplayFrame(rf) {
  const F = recording.frames, i0 = Math.min(Math.floor(rf), replay.last), i1 = Math.min(i0 + 1, replay.last), t = rf - i0;
  const a = F[i0], b = F[i1];
  recording.tracked.forEach((body, i) => {
    const k = i * 4;
    body.plugin.rhidden = !a[k];
    body.position.x = a[k + 1] + (b[k + 1] - a[k + 1]) * t;
    body.position.y = a[k + 2] + (b[k + 2] - a[k + 2]) * t;
    body.angle = a[k + 3] + (b[k + 3] - a[k + 3]) * t;
  });
}
function drawReplay(dtMs) {
  const R = replay;
  const slowNow = R.slow[Math.min(R.last, Math.floor(R.rf))];
  const targetSpeed = reducedMotion ? 1 : slowNow ? 0.25 : 1;
  R.speed += (targetSpeed - R.speed) * 0.15;
  const next = Math.min(R.last, R.rf + R.speed * dtMs / STEP);
  while (R.ei < R.events.length && R.events[R.ei].step <= next) { const e = R.events[R.ei++]; runFx(e.type, e.d); }
  R.rf = next;
  applyReplayFrame(R.rf);
  if (R.rf >= R.last) { R.hold += dtMs; if (R.hold > 900) { endReplay(); return; } }
  // cinematic camera: zoom in during slow moments, keep the stuntman framed
  const tz = reducedMotion ? 1 : slowNow ? 1.45 : 1.1;
  R.zoom += (tz - R.zoom) * 0.06;
  const s = scale * R.zoom, t = rag.torso.position;
  vw = cw / s;
  let cx = t.x - vw * 0.45;
  cx = level.W < vw ? (level.W - vw) / 2 : Math.max(0, Math.min(level.W - vw, cx));
  camX += (cx - camX) * 0.18;
  let oy = ch * 0.55 - t.y * s;
  oy = Math.max(ch - H * s, oy);
  R.oy = R.oy === undefined ? oy : R.oy + (oy - R.oy) * 0.15;
  shake *= 0.88;
  const sx = reducedMotion ? 0 : (Math.random() - 0.5) * shake, sy = reducedMotion ? 0 : (Math.random() - 0.5) * shake;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = "#0d0f17"; ctx.fillRect(0, 0, cw, ch);
  ctx.setTransform(dpr * s, 0, 0, dpr * s, (-camX * s + sx) * dpr, (R.oy + sy) * dpr);
  drawBackdrop(); drawFloor(); drawBodies(); drawCannon(); drawRag(); drawParticles(dtMs / 1000 * R.speed);
  // film overlay: grade, letterbox, badge, scrubber
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = slowNow ? "rgba(120,180,255,.10)" : "rgba(255,190,90,.05)"; ctx.fillRect(0, 0, cw, ch);
  const bar = Math.round(ch * 0.08);
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, cw, bar); ctx.fillRect(0, ch - bar, cw, bar);
  const pad = Math.max(16, cw * 0.03);
  ctx.textBaseline = "middle"; ctx.textAlign = "left";
  ctx.fillStyle = "#ff4b3a"; ctx.beginPath(); ctx.arc(pad + 6, bar / 2, 6, 0, Math.PI * 2); ctx.fill();
  ctx.font = "600 15px 'IBM Plex Mono', monospace"; ctx.fillStyle = "#ebe6da";
  ctx.fillText(`REPLAY  ${contract.title}  TAKE ${takeNo}`, pad + 20, bar / 2);
  ctx.textAlign = "right"; ctx.fillStyle = slowNow ? "#8fd3ff" : "#ffb23e";
  ctx.fillText(`${R.speed.toFixed(2)}x`, cw - pad, bar / 2);
  const tc = (R.rf / 60).toFixed(2).padStart(5, "0");
  ctx.textAlign = "left"; ctx.fillStyle = "#8b8fa3"; ctx.fillText(`00:${tc}`, pad, ch - bar / 2);
  const x0 = pad + 80, x1 = cw - pad;
  ctx.fillStyle = "#2c3040"; ctx.fillRect(x0, ch - bar / 2 - 2, x1 - x0, 4);
  for (const e of R.events) if (KEY_FX[e.type] || (e.type === "sfx" && e.d.n === "bell")) { ctx.fillStyle = "#8fd3ff"; ctx.fillRect(x0 + (x1 - x0) * e.step / R.last - 1, ch - bar / 2 - 6, 2, 12); }
  ctx.fillStyle = "#ff4b3a"; ctx.fillRect(x0, ch - bar / 2 - 2, (x1 - x0) * R.rf / R.last, 4);
  ctx.textBaseline = "alphabetic";
}

/* ================= boot ================= */
function start() {
  showOffice();
  requestAnimationFrame(frame);
}
// test hooks (harmless in production)
window.__stunt = {
  get rag() { return rag; }, start: i => startContract(i), thrust: v => { thrustInput = v; }, replay: () => startReplay(), get state() { return state; }, spin: d => { spinInput = d; }, aim: (a, p) => { aim.angle = a; aim.power = p; }, launch,
  sim(steps) { for (let i = 0; i < steps && (state === "fly" || state === "aim"); i++) stepPhysics(); return { state, stats: stats && JSON.parse(JSON.stringify(stats)), x: rag && rag.torso.position.x, y: rag && rag.torso.position.y }; },
  get save() { return save; }, set save(s) { save = s; },

try { window.claude && window.claude.hot && window.claude.hot.snapshot && window.claude.hot.snapshot(() => ({ save })); } catch (e) {}
const boot = d => { if (d && d.save) save = Object.assign(clone(DEFAULT), d.save); start(); };
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(boot); else boot((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();
