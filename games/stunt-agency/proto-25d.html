<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>스턴트 대역 사무소 — 2.5D 시안</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8fd0ff; font-family: "IBM Plex Sans KR", sans-serif; }
  canvas { display: block; touch-action: none; }
  .hud { position: fixed; left: 14px; top: 14px; background: rgba(255,255,255,.88); border-radius: 12px; padding: 10px 14px; box-shadow: 0 4px 14px rgba(0,40,80,.18); color: #1c2433; }
  .hud h1 { margin: 0 0 2px; font-family: "Black Han Sans", sans-serif; font-weight: 400; font-size: 22px; }
  .hud .obj { font-size: 13px; }
  .hud .obj.done { color: #138a52; font-weight: 700; }
  .hud .aim { font-size: 12px; color: #536079; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .tag { position: fixed; right: 14px; top: 14px; background: #ff4b3a; color: #fff; font-weight: 700; border-radius: 999px; padding: 6px 12px; font-size: 12px; }
  .hint { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: rgba(20,30,50,.78); color: #fff; padding: 8px 16px; border-radius: 999px; font-size: 13px; white-space: nowrap; max-width: calc(100% - 24px); overflow: hidden; text-overflow: ellipsis; }
  .banner { position: fixed; left: 50%; top: 38%; transform: translate(-50%, -50%) scale(.6); font-family: "Black Han Sans", sans-serif; font-size: clamp(42px, 9vw, 96px); color: #fff; -webkit-text-stroke: 3px #1c2433; text-shadow: 0 6px 0 #1c2433; opacity: 0; transition: transform .35s cubic-bezier(.2,1.6,.4,1), opacity .2s; pointer-events: none; white-space: nowrap; }
  .banner.on { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .banner.ok { color: #ffd23e; }
  .banner.ng { color: #ff6b5a; }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
</head>
<body>
<div class="hud"><h1>시골 로맨스: 건초 속으로</h1><div class="obj" id="obj">□ 건초더미에 착지</div><div class="aim" id="aim"></div></div>
<div class="tag">2.5D 시안</div>
<div class="hint" id="hint">드래그로 조준 후 놓으면 발사 · ↑↓ 각도 · ←→ 힘 · Space 발사 · R 다시</div>
<div class="banner" id="banner"></div>
<script type="module">
import * as THREE from "three";
const { Engine, Bodies, Body, Composite, Constraint, Events } = Matter;

/* ---------- physics: same numbers as the 2D game (px, y down) ---------- */
const GROUND = 860, STEP = 1000 / 60, LAUNCHER = { x: 150, y: GROUND - 70 };
const HAY = { x: 980, w: 250 };
const ZONE = { x0: HAY.x - HAY.w / 2, x1: HAY.x + HAY.w / 2, y0: GROUND - 170 };
const S = 50; // px per 3D unit
const X = x => x / S, Y = y => (GROUND - y) / S;

let engine, rag = null, state = "aim", stats = null, slow = 0;
const aim = { angle: 42, power: 0.72 };

function buildWorld() {
  engine = Engine.create(); engine.gravity.y = 1;
  const ground = Bodies.rectangle(900, GROUND + 60, 4000, 120, { isStatic: true, friction: 0.9, restitution: 0.05 });
  ground.plugin = { kind: "ground" };
  const hay = Bodies.rectangle(HAY.x, GROUND - 22, HAY.w, 44, { isStatic: true, friction: 1, restitution: 0, chamfer: { radius: 14 } });
  hay.plugin = { kind: "hay" };
  Composite.add(engine.world, [ground, hay]);
  Events.on(engine, "collisionStart", e => {
    if (state !== "fly") return;
    for (const p of e.pairs) {
      const r = p.bodyA.plugin.rag ? p.bodyA : p.bodyB.plugin.rag ? p.bodyB : null;
      const o = r === p.bodyA ? p.bodyB : p.bodyA;
      if (!r || o.plugin.rag) continue;
      if (o.plugin.kind === "hay") {
        for (const q of rag.parts) Body.setVelocity(q, { x: q.velocity.x * 0.45, y: q.velocity.y * 0.35 });
        if (!stats.hayHit) { stats.hayHit = true; slow = 26; burst(r.position.x, GROUND - 40, 0xf2c84b, 34, 9); shake = 0.25; }
      } else if (o.plugin.kind === "ground" && !stats.thud) {
        stats.thud = true; burst(r.position.x, GROUND - 4, 0xc9a77a, 16, 5); shake = 0.35;
      }
    }
  });
}
function buildRagdoll(x, y, rot) {
  const group = Body.nextGroup(true);
  const o = { collisionFilter: { group }, frictionAir: 0.004, friction: 0.6, restitution: 0.15, density: 0.0012 };
  const part = (b, p) => { b.plugin = { rag: true, part: p }; return b; };
  const torso = part(Bodies.rectangle(x, y, 22, 48, Object.assign({ chamfer: { radius: 8 } }, o)), "torso");
  const head = part(Bodies.circle(x, y - 38, 13, o), "head");
  const armL = part(Bodies.rectangle(x - 2, y, 9, 36, Object.assign({ chamfer: { radius: 4 } }, o)), "armL");
  const armR = part(Bodies.rectangle(x + 2, y, 9, 36, Object.assign({ chamfer: { radius: 4 } }, o)), "armR");
  const legL = part(Bodies.rectangle(x - 5, y + 43, 11, 46, Object.assign({ chamfer: { radius: 5 } }, o)), "legL");
  const legR = part(Bodies.rectangle(x + 5, y + 43, 11, 46, Object.assign({ chamfer: { radius: 5 } }, o)), "legR");
  const j = (a, b, pa, pb) => Constraint.create({ bodyA: a, bodyB: b, pointA: pa, pointB: pb, length: 0, stiffness: 0.7, damping: 0.05 });
  const comp = Composite.create();
  Composite.add(comp, [torso, head, armL, armR, legL, legR,
    j(torso, head, { x: 0, y: -24 }, { x: 0, y: 13 }), j(torso, armL, { x: 0, y: -18 }, { x: 0, y: -18 }), j(torso, armR, { x: 0, y: -18 }, { x: 0, y: -18 }),
    j(torso, legL, { x: -5, y: 20 }, { x: 0, y: -23 }), j(torso, legR, { x: 5, y: 20 }, { x: 0, y: -23 })]);
  Composite.rotate(comp, rot, { x, y });
  return { comp, torso, parts: [torso, head, armL, armR, legL, legR] };
}
function launch() {
  if (state !== "aim") return;
  const a = aim.angle * Math.PI / 180, v = 21 * aim.power, dx = Math.cos(a), dy = -Math.sin(a);
  const mx = LAUNCHER.x + dx * 70, my = LAUNCHER.y + dy * 70;
  rag = buildRagdoll(mx, my, Math.atan2(dy, dx) + Math.PI / 2);
  Composite.add(engine.world, rag.comp);
  for (const p of rag.parts) Body.setVelocity(p, { x: dx * v, y: dy * v });
  Body.setAngularVelocity(rag.torso, (Math.random() - 0.5) * 0.04);
  stats = { steps: 0, still: 0, hayHit: false, thud: false };
  state = "fly"; shake = 0.4; recoil = 1;
  puff(X(mx), Y(my), dx, -dy);
  setRagVisible(true); hideBanner();
}
function stepPhysics() {
  engine.timing.timeScale = slow > 0 ? 0.3 : 1; if (slow > 0) slow--;
  Engine.update(engine, STEP);
  if (state !== "fly") return;
  stats.steps++;
  const still = rag.parts.every(p => p.speed < 0.35);
  stats.still = still ? stats.still + 1 : 0;
  const t = rag.torso.position;
  if ((stats.steps > 50 && stats.still > 40) || stats.steps > 720 || t.x > 2600) endTake();
}
function endTake() {
  state = "result";
  const t = rag.torso.position, ok = t.x >= ZONE.x0 && t.x <= ZONE.x1 && t.y >= ZONE.y0;
  document.getElementById("obj").textContent = (ok ? "■" : "□") + " 건초더미에 착지";
  document.getElementById("obj").classList.toggle("done", ok);
  showBanner(ok ? "오케이!" : "컷!", ok ? "ok" : "ng");
  if (ok) burst(t.x, GROUND - 60, 0xffd23e, 40, 10, true);
  updateHint();
}
function reset() {
  if (rag) Composite.remove(engine.world, rag.comp);
  rag = null; stats = null; state = "aim"; slow = 0;
  setRagVisible(false); hideBanner();
  document.getElementById("obj").textContent = "□ 건초더미에 착지"; document.getElementById("obj").classList.remove("done");
  updateHint();
}

/* ---------- 3D scene ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xbfe6ff, 40, 110);
const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 400);

// sky dome with a vertical gradient
{
  const g = new THREE.SphereGeometry(200, 32, 16);
  const m = new THREE.ShaderMaterial({ side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { top: { value: new THREE.Color(0x3d9cf0) }, bottom: { value: new THREE.Color(0xd9f1ff) } },
    vertexShader: "varying vec3 p; void main(){ p = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }",
    fragmentShader: "uniform vec3 top; uniform vec3 bottom; varying vec3 p; void main(){ float h = clamp(p.y*1.6+0.15,0.0,1.0); gl_FragColor = vec4(mix(bottom, top, h),1.0); }" });
  scene.add(new THREE.Mesh(g, m));
}
scene.add(new THREE.HemisphereLight(0xdff3ff, 0x8a6a45, 1.1));
const sun = new THREE.DirectionalLight(0xfff1d6, 2.4);
sun.position.set(-14, 26, 22); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -30, right: 30, top: 22, bottom: -10, near: 1, far: 90 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);

const mat = (color, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.85, metalness: 0, flatShading: true }, o));
const mesh = (geo, m, { x = 0, y = 0, z = 0, cast = true, receive = true } = {}) => { const me = new THREE.Mesh(geo, m); me.position.set(x, y, z); me.castShadow = cast; me.receiveShadow = receive; scene.add(me); return me; };

// ground: grass field, dirt lot and a plank runway under the stunt line
mesh(new THREE.PlaneGeometry(400, 200).rotateX(-Math.PI / 2), mat(0x7cc35a), { z: -40, cast: false });
mesh(new THREE.BoxGeometry(60, 0.1, 9), mat(0xd9b27c), { x: 18, y: 0.0, z: 0, cast: false });
for (let i = 0; i < 26; i++) mesh(new THREE.BoxGeometry(1.9, 0.12, 2.4), mat(i % 2 ? 0xa0703f : 0xb07d48), { x: -2 + i * 2, y: 0.06, z: 0, cast: false });

// distance boards like the 2D ruler
for (let m = 5; m <= 30; m += 5) {
  const x = X(150 + m * 50);
  mesh(new THREE.BoxGeometry(0.08, 0.7, 0.08), mat(0xffffff), { x, y: 0.35, z: 3.4 });
  const c = document.createElement("canvas"); c.width = 128; c.height = 64; const g = c.getContext("2d");
  g.fillStyle = "#ffffff"; g.fillRect(0, 0, 128, 64); g.fillStyle = "#1c2433"; g.font = "bold 38px sans-serif"; g.textAlign = "center"; g.fillText(m + "m", 64, 46);
  const sign = mesh(new THREE.PlaneGeometry(0.9, 0.45), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c) }), { x, y: 0.85, z: 3.42, cast: false });
}

// cannon: striped barrel on a wheeled carriage
const cannon = new THREE.Group(); scene.add(cannon);
cannon.position.set(X(LAUNCHER.x), Y(LAUNCHER.y), 0);
const barrel = new THREE.Group(); cannon.add(barrel);
{
  const stripes = 6, len = 2.6;
  for (let i = 0; i < stripes; i++) {
    const seg = new THREE.Mesh(new THREE.CylinderGeometry(0.46, 0.5, len / stripes, 18), mat(i % 2 ? 0xffffff : 0xe8392f, { roughness: 0.55 }));
    seg.rotation.z = -Math.PI / 2; seg.position.x = -0.5 + (i + 0.5) * len / stripes; seg.castShadow = true; barrel.add(seg);
  }
  const lip = new THREE.Mesh(new THREE.TorusGeometry(0.47, 0.09, 8, 20), mat(0x2b2f3a, { metalness: 0.4, roughness: 0.4 }));
  lip.rotation.y = Math.PI / 2; lip.position.x = 2.1; barrel.add(lip);
  const cap = new THREE.Mesh(new THREE.SphereGeometry(0.5, 16, 10, 0, Math.PI * 2, 0, Math.PI / 2), mat(0x2b2f3a));
  cap.rotation.z = Math.PI / 2; cap.position.x = -0.5; barrel.add(cap);
  const base = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.5, 1.4), mat(0x6b4a2b)); base.position.set(0.2, -0.95, 0); base.castShadow = true; cannon.add(base);
  for (const [wx, wz] of [[-0.5, 0.75], [0.9, 0.75], [-0.5, -0.75], [0.9, -0.75]]) {
    const w = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 0.18, 14), mat(0x3a2a1c)); w.rotation.x = Math.PI / 2; w.position.set(wx, -1.0, wz); w.castShadow = true; cannon.add(w);
    const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 0.2, 8), mat(0xffd23e)); hub.rotation.x = Math.PI / 2; hub.position.set(wx, -1.0, wz * 1.05); cannon.add(hub);
  }
}
let recoil = 0;

// hay pile: squashed low-poly mounds and a few straw bales
const hay = new THREE.Group(); scene.add(hay); hay.position.set(X(HAY.x), 0, 0);
{
  const hm = mat(0xf2c84b), hm2 = mat(0xe0b23a);
  const blobs = [[0, 0.55, 0, 1.55], [-1.3, 0.4, 0.3, 1.1], [1.3, 0.42, -0.2, 1.15], [-0.5, 0.35, 1.0, 0.95], [0.7, 0.33, 1.0, 0.9], [0.2, 0.9, -0.5, 1.0]];
  for (const [x, y, z, r] of blobs) { const b = new THREE.Mesh(new THREE.IcosahedronGeometry(r, 1), Math.random() < 0.5 ? hm : hm2); b.scale.y = 0.55; b.position.set(x, y, z); b.castShadow = b.receiveShadow = true; hay.add(b); }
  for (let i = 0; i < 40; i++) { const s = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.03, 0.03), hm2); s.position.set((Math.random() - 0.5) * 4, 0.05, (Math.random() - 0.5) * 3); s.rotation.y = Math.random() * 3; hay.add(s); }
  for (const [x, z] of [[3.4, -1.4], [3.0, 1.6]]) { const b = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.7, 0.8), hm2); b.position.set(x, 0.35, z); b.rotation.y = 0.3; b.castShadow = true; hay.add(b); }
}
// target marker: a bobbing arrow over the hay
const marker = mesh(new THREE.ConeGeometry(0.35, 0.7, 4), mat(0xff4b3a, { emissive: 0x551010 }), { x: X(HAY.x), y: 3.6, z: 0 });
marker.rotation.x = Math.PI;

// film set backdrop: western-town facades, a water tower, light towers, crane, trees, hills
function facade(x, w, h, col, z = -9) {
  const g = new THREE.Group(); g.position.set(x, 0, z); scene.add(g);
  const front = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.4), mat(col)); front.position.y = h / 2; front.castShadow = front.receiveShadow = true; g.add(front);
  const top = new THREE.Mesh(new THREE.BoxGeometry(w + 0.3, 0.3, 0.6), mat(0xffffff)); top.position.y = h + 0.15; g.add(top);
  for (let i = 0; i < Math.floor(w / 1.6); i++) for (let k = 0; k < Math.floor((h - 1.4) / 1.6); k++) {
    const win = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.9, 0.1), mat(0x5aa6d6, { roughness: 0.3 })); win.position.set(-w / 2 + 0.9 + i * 1.6, 1.6 + k * 1.6, 0.22); g.add(win);
  }
}
const cols = [0xff8a5c, 0x7fc8f8, 0xffd166, 0xb388eb, 0x8be3a6, 0xff6f91];
let fx = -12; for (let i = 0; i < 12; i++) { const w = 3.2 + Math.random() * 2.2; facade(fx + w / 2, w, 3.2 + Math.random() * 3.4, cols[i % cols.length]); fx += w + 0.6; }
// water tower
{ const g = new THREE.Group(); g.position.set(26, 0, -15); scene.add(g);
  for (const [x, z] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) { const l = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.12, 6, 6), mat(0x8a6a45)); l.position.set(x, 3, z); g.add(l); }
  const tank = new THREE.Mesh(new THREE.CylinderGeometry(1.8, 1.8, 2.4, 14), mat(0xe8392f)); tank.position.y = 7.2; tank.castShadow = true; g.add(tank);
  const roof = new THREE.Mesh(new THREE.ConeGeometry(2.0, 1.2, 14), mat(0x2b2f3a)); roof.position.y = 9; g.add(roof); }
// light towers
for (const [x, z] of [[4, -5], [30, -5]]) { const g = new THREE.Group(); g.position.set(x, 0, z); scene.add(g);
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.16, 8, 6), mat(0x9aa3b5, { metalness: 0.5 })); pole.position.y = 4; pole.castShadow = true; g.add(pole);
  for (let i = 0; i < 4; i++) { const lamp = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.5), mat(0x2b2f3a)); lamp.position.set(-0.75 + i * 0.5, 8.2, 0.2); g.add(lamp);
    const glass = new THREE.Mesh(new THREE.CircleGeometry(0.22, 10), new THREE.MeshBasicMaterial({ color: 0xfff6c8 })); glass.position.set(-0.75 + i * 0.5, 8.2, 0.46); g.add(glass); } }
// camera crane pointing at the hay
{ const g = new THREE.Group(); g.position.set(X(HAY.x) + 6, 0, -4); scene.add(g);
  const base = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.5, 1.4), mat(0x2b2f3a)); base.position.y = 0.25; g.add(base);
  const arm = new THREE.Mesh(new THREE.BoxGeometry(6, 0.25, 0.25), mat(0xffd23e)); arm.position.set(-2.2, 3.2, 0); arm.rotation.z = -0.35; arm.castShadow = true; g.add(arm);
  const post = new THREE.Mesh(new THREE.BoxGeometry(0.3, 3, 0.3), mat(0x2b2f3a)); post.position.y = 1.8; g.add(post);
  const cam = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.6, 0.5), mat(0x1c2433)); cam.position.set(-4.9, 2.1, 0); g.add(cam);
  const lens = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.22, 0.4, 10), mat(0x1c2433)); lens.rotation.z = Math.PI / 2; lens.position.set(-5.4, 2.1, 0); g.add(lens); }
// trees and hills
function tree(x, z, s = 1) { const t = mesh(new THREE.CylinderGeometry(0.15 * s, 0.2 * s, 1 * s, 6), mat(0x7a5230), { x, y: 0.5 * s, z });
  for (let k = 0; k < 3; k++) mesh(new THREE.ConeGeometry((1.1 - k * 0.25) * s, 1.4 * s, 7), mat(k % 2 ? 0x3f9b4b : 0x4fb35a), { x, y: (1.3 + k * 0.7) * s, z }); }
for (let i = 0; i < 26; i++) tree(-14 + i * 2.6 + Math.random(), -13 - Math.random() * 6, 0.9 + Math.random() * 0.8);
// low bushes in front, kept short so they never hide the stunt line
for (let i = 0; i < 14; i++) { const b = mesh(new THREE.IcosahedronGeometry(0.45 + Math.random() * 0.25, 0), mat(i % 2 ? 0x4fb35a : 0x3f9b4b), { x: -8 + i * 3.6 + Math.random(), y: 0.25, z: 4.2 + Math.random() * 1.5 }); b.scale.y = 0.7; }
for (let i = 0; i < 7; i++) { const h = mesh(new THREE.SphereGeometry(12 + Math.random() * 8, 12, 8), mat(i % 2 ? 0x6cb84f : 0x86c95e), { x: -30 + i * 18, y: -6, z: -45 - Math.random() * 10, cast: false }); h.scale.y = 0.6; }
// clouds
const clouds = [];
for (let i = 0; i < 9; i++) { const g = new THREE.Group(); g.position.set(-20 + i * 10, 20 + Math.random() * 6, -55 - Math.random() * 15); scene.add(g); clouds.push(g);
  for (let k = 0; k < 4; k++) { const b = new THREE.Mesh(new THREE.IcosahedronGeometry(1.4 + Math.random(), 1), new THREE.MeshStandardMaterial({ color: 0xffffff, flatShading: true, roughness: 1 })); b.position.set(k * 1.4 - 2, Math.random() * 0.6, Math.random()); g.add(b); } }

/* ---------- stuntman: low-poly parts that follow the 2D bodies ---------- */
const suit = mat(0xffb000, { roughness: 0.6 }), suitDark = mat(0xd88a00, { roughness: 0.6 }), skin = mat(0xf0c8a0), helmet = mat(0xe5402a, { roughness: 0.35 }), visor = mat(0x1d2840, { roughness: 0.2, metalness: 0.3 }), white = mat(0xffffff);
const partMeshes = {};
function makePart(name, geo, m, z) { const g = new THREE.Group(); const me = new THREE.Mesh(geo, m); me.castShadow = true; g.add(me); g.userData.z = z; scene.add(g); partMeshes[name] = g; return g; }
makePart("legL", new THREE.CapsuleGeometry(0.12, 0.7, 4, 8), suitDark, -0.16);
makePart("armL", new THREE.CapsuleGeometry(0.1, 0.55, 4, 8), suitDark, -0.26);
{ const t = makePart("torso", new THREE.BoxGeometry(0.46, 0.96, 0.42), suit, 0);
  const stripe = new THREE.Mesh(new THREE.BoxGeometry(0.47, 0.1, 0.43), mat(0x1c2433)); stripe.position.y = -0.02; t.add(stripe);
  const badge = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.24, 0.02), white); badge.position.set(0, 0.26, 0.22); t.add(badge); }
makePart("legR", new THREE.CapsuleGeometry(0.12, 0.7, 4, 8), suit, 0.16);
makePart("armR", new THREE.CapsuleGeometry(0.1, 0.55, 4, 8), suit, 0.26);
{ const h = makePart("head", new THREE.IcosahedronGeometry(0.26, 1), skin, 0);
  const hel = new THREE.Mesh(new THREE.SphereGeometry(0.29, 14, 8, 0, Math.PI * 2, 0, Math.PI * 0.55), helmet); hel.position.y = 0.02; hel.castShadow = true; h.add(hel);
  const v = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.1, 0.36), visor); v.position.set(0.22, -0.02, 0); h.add(v);
  const s = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.04, 0.3), white); s.position.set(0, 0.22, 0); h.add(s); }
function setRagVisible(v) { for (const k in partMeshes) partMeshes[k].visible = v; }
setRagVisible(false);
function syncRag() {
  if (!rag) return;
  for (const b of rag.parts) { const g = partMeshes[b.plugin.part]; g.position.set(X(b.position.x), Y(b.position.y), g.userData.z); g.rotation.z = -b.angle; }
}

/* ---------- aim preview and effects ---------- */
const dots = []; const dotMat = new THREE.MeshBasicMaterial({ color: 0xffd23e });
for (let i = 0; i < 16; i++) { const d = new THREE.Mesh(new THREE.SphereGeometry(0.12, 10, 8), dotMat); scene.add(d); dots.push(d); }
function updateAim() {
  const a = aim.angle * Math.PI / 180, v = 21 * aim.power, dx = Math.cos(a), dy = -Math.sin(a);
  barrel.rotation.z = a;
  let x = LAUNCHER.x + dx * 70, y = LAUNCHER.y + dy * 70, vx = dx * v, vy = dy * v; const g = 0.001 * STEP * STEP;
  for (let i = 0; i < dots.length; i++) { for (let k = 0; k < 4; k++) { vy += g; vx *= 0.996; vy *= 0.996; x += vx; y += vy; } dots[i].position.set(X(x), Y(y), 0); dots[i].visible = state === "aim" && y < GROUND; dots[i].scale.setScalar(1 - i * 0.03); }
  document.getElementById("aim").textContent = `각도 ${aim.angle}° · 힘 ${Math.round(aim.power * 100)}%`;
}
const parts = [];
const puffMat = new THREE.MeshStandardMaterial({ color: 0xffffff, flatShading: true, roughness: 1, transparent: true });
function puff(x, y, dx, dy) { for (let i = 0; i < 18; i++) { const m = new THREE.Mesh(new THREE.IcosahedronGeometry(0.25 + Math.random() * 0.3, 0), puffMat.clone()); m.position.set(x, y, (Math.random() - 0.5) * 0.6); scene.add(m); parts.push({ m, vx: dx * (2 + Math.random() * 3) + (Math.random() - 0.5), vy: dy * (2 + Math.random() * 3) + Math.random(), vz: (Math.random() - 0.5) * 2, life: 1, max: 1, grow: 2.2, grav: -0.6 }); } }
function burst(px, py, color, n, speed, confetti) { const pm = mat(color); for (let i = 0; i < n; i++) { const m = new THREE.Mesh(confetti ? new THREE.BoxGeometry(0.16, 0.16, 0.03) : new THREE.BoxGeometry(0.4, 0.04, 0.04), confetti ? mat([0xffd23e, 0xff4b3a, 0x3d9cf0, 0x4fd18b][i % 4]) : pm); m.position.set(X(px), Y(py), (Math.random() - 0.5)); m.castShadow = true; scene.add(m); parts.push({ m, vx: (Math.random() - 0.5) * speed * 0.5, vy: Math.random() * speed * 0.6 + 2, vz: (Math.random() - 0.5) * speed * 0.4, life: 1.4, max: 1.4, grow: 0, grav: 12, spin: (Math.random() - 0.5) * 12 }); } }
function updateParts(dt) {
  for (const p of parts) { p.life -= dt; p.vy -= p.grav * dt; p.m.position.x += p.vx * dt; p.m.position.y += p.vy * dt; p.m.position.z += p.vz * dt;
    if (p.m.position.y < 0.03) { p.m.position.y = 0.03; p.vy *= -0.3; p.vx *= 0.6; p.vz *= 0.6; }
    if (p.spin) { p.m.rotation.x += p.spin * dt; p.m.rotation.y += p.spin * dt * 0.7; }
    if (p.grow) { const s = 1 + (1 - p.life / p.max) * p.grow; p.m.scale.setScalar(s); p.m.material.opacity = Math.max(0, p.life / p.max); }
    if (p.life <= 0) { scene.remove(p.m); } }
  for (let i = parts.length - 1; i >= 0; i--) if (parts[i].life <= 0) parts.splice(i, 1);
}

/* ---------- UI ---------- */
let bannerT = null;
function showBanner(t, cls) { const b = document.getElementById("banner"); b.textContent = t; b.className = "banner " + cls; requestAnimationFrame(() => b.classList.add("on")); }
function hideBanner() { document.getElementById("banner").className = "banner"; }
function updateHint() { document.getElementById("hint").textContent = state === "aim" ? "드래그로 조준 후 놓으면 발사 · ↑↓ 각도 · ←→ 힘 · Space 발사" : state === "fly" ? "날아가는 중…" : "R 또는 화면 클릭으로 다시 찍기"; }
addEventListener("keydown", e => {
  if (state === "aim") {
    if (e.key === "ArrowUp") aim.angle = Math.min(85, aim.angle + 2);
    if (e.key === "ArrowDown") aim.angle = Math.max(-5, aim.angle - 2);
    if (e.key === "ArrowRight") aim.power = Math.min(1, +(aim.power + 0.03).toFixed(2));
    if (e.key === "ArrowLeft") aim.power = Math.max(0.15, +(aim.power - 0.03).toFixed(2));
    if (e.key === " ") launch();
    if (e.key.startsWith("Arrow") || e.key === " ") e.preventDefault();
  }
  if ((e.key === "r" || e.key === "R") && state !== "aim") reset();
});
let drag = null;
renderer.domElement.addEventListener("pointerdown", e => { if (state === "result") { reset(); return; } if (state !== "aim") return; drag = { x: e.clientX, y: e.clientY, moved: false }; renderer.domElement.setPointerCapture(e.pointerId); });
renderer.domElement.addEventListener("pointermove", e => { if (!drag) return; const vx = drag.x - e.clientX, vy = drag.y - e.clientY, len = Math.hypot(vx, vy); if (len < 12) return; drag.moved = true;
  aim.angle = Math.round(Math.max(-5, Math.min(85, Math.atan2(-vy, vx) * 180 / Math.PI))); aim.power = Math.max(0.15, Math.min(1, len / (Math.min(innerWidth, innerHeight) * 0.32))); });
renderer.domElement.addEventListener("pointerup", () => { if (drag && drag.moved) launch(); drag = null; });

/* ---------- camera and loop ---------- */
function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();
let camX = X(LAUNCHER.x) + 6, shake = 0, last = performance.now(), acc = 0, previewT = performance.now();
function frame(now) {
  const dtMs = Math.min(50, now - last); last = now; const dt = dtMs / 1000;
  acc += dtMs; let n = 0; while (acc >= STEP && n < 4) { stepPhysics(); acc -= STEP; n++; } if (n === 4) acc = 0;
  syncRag(); updateAim(); updateParts(dt);
  recoil *= 0.88; barrel.position.x = -recoil * 0.5;
  marker.position.y = 3.6 + Math.sin(now / 300) * 0.25; marker.rotation.y += dt * 2;
  for (const c of clouds) { c.position.x += dt * 0.4; if (c.position.x > 70) c.position.x = -30; }
  // follow the stuntman; before the shot, pan to show the hay then come back
  const portrait = innerWidth < innerHeight;
  let tx = X(LAUNCHER.x) + (portrait ? 3 : 7);
  if (rag) tx = X(rag.torso.position.x) + (portrait ? 1 : 3);
  else if (state === "aim" && now - previewT < 1400) tx = X(HAY.x) - 2;
  camX += (tx - camX) * (state === "aim" ? 0.06 : 0.1);
  shake *= 0.9; const sx = (Math.random() - 0.5) * shake, sy = (Math.random() - 0.5) * shake;
  const dist = portrait ? 30 : 21;
  camera.position.set(camX - 5 + sx, 6.2 + sy, dist);
  camera.lookAt(camX, 2.6, 0);
  sun.position.set(camX - 14, 26, 22); sun.target.position.set(camX, 0, 0);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
buildWorld(); updateHint(); requestAnimationFrame(frame);
window.__proto = { launch, reset, aim, get state() { return state; } };
</script>
